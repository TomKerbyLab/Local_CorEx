[project]
name = "local-corex"
version = "0.1.0"
description = "Local Correlation Explanation and utilities"
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "datasets>=3.4.1",
    "huggingface-hub>=0.29.3",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "numpy",
    "scipy",
    "scikit-learn>=1.6.1",
    "tqdm>=4.67.1",
    "ucimlrepo>=0.0.7",
]

[project.optional-dependencies]
nn = [
    "pytorch-lightning>=2.5.0.post0",
    "tensorboard>=2.19.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]
partition = [
    "phate>=1.0.11; python_version < '3.13'",
    "scprep>=1.2.3; python_version < '3.13'",
]
plotting = [
    "imageio>=2.37.0",
    "matplotlib",
    "pandas; python_version < '3.13'",
    "pandas>=2.2; python_version >= '3.13'",
    "seaborn>=0.13.2",
]
test = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
